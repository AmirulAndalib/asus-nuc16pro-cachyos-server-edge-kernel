name: Build scx schedulers + loader (sched-ext/scx)

# NOTE: the `name:` above is load-bearing. version-drift-check.yml lists it verbatim under
# on.workflow_run.workflows, and a workflow_run trigger that names a workflow it cannot
# resolve fails silently. That check asserts the two stay in sync, so rename both together.
# That same check dispatches this workflow the moment sched-ext/scx publishes a release,
# so the daily cron below is a backstop, not the primary trigger.

run-name: >-
  scx build (${{ github.event_name == 'workflow_dispatch'
    && (inputs.force && 'manual, forced' || 'manual')
    || 'scheduled' }})

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if this scx tag already has a release'
        required: false
        default: false
        type: boolean
  schedule:
    # 3am UTC daily - clear of the kernel workflows' 9am/9pm UTC slots.
    - cron: "0 3 * * *"

# Least privilege at the top; the build job widens to exactly what publishing needs.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: nuc16pro-scx-schedulers
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build scx schedulers + scx_loader/scxctl for ASUS NUC 16 Pro
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # publish the GitHub Release
      id-token: write        # OIDC token for build provenance signing
      attestations: write    # write the provenance attestation for the built binaries
    outputs:
      scx_tag: ${{ steps.preflight.outputs.scx_tag }}
      skipped: ${{ steps.preflight.outputs.skip }}
      release_tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes to git; the release is published with GH_TOKEN via gh.
          # Leaving the token in .git/config would put it inside any artifact that ever
          # captured the workspace.
          persist-credentials: false

      - name: Show runner info
        run: |
          uname -a
          df -h
          free -h
          docker version

      - name: Pre-flight - skip if scx tag already has a release
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Through env, never interpolated into the script body: a workflow input is
          # caller-controlled text and must not be able to become shell.
          FORCE_BUILD: ${{ inputs.force }}
        run: |
          set -euo pipefail

          SCX_TAG="$(gh api repos/sched-ext/scx/releases/latest --jq '.tag_name')"
          if [ -z "$SCX_TAG" ] || [ "$SCX_TAG" = "null" ]; then
            echo "error: could not resolve sched-ext/scx latest release tag"
            exit 1
          fi
          echo "Upstream scx tag: $SCX_TAG"
          echo "scx_tag=$SCX_TAG" >> "$GITHUB_OUTPUT"

          RECENT="$(gh release list \
            --repo "$REPO" \
            --limit 50 \
            --json tagName \
            --jq '.[].tagName' 2>/dev/null || true)"

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "FORCE: skipping version check, building regardless"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif echo "$RECENT" | grep -q "scx-${SCX_TAG}-"; then
            echo "SKIP: $SCX_TAG already has a release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped - already built"
              echo "scx \`$SCX_TAG\` already present in releases."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BUILD: $SCX_TAG not yet released"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.preflight.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build builder image
        if: steps.preflight.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.scx-builder
          tags: scx-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build scx schedulers
        if: steps.preflight.outputs.skip != 'true'
        env:
          # Resolved from the sched-ext/scx API response, so it is third-party text.
          # Passing it through env keeps it data rather than shell.
          SCX_TAG: ${{ steps.preflight.outputs.scx_tag }}
        run: |
          chmod +x scripts/build-scx-schedulers.sh
          mkdir -p dist

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e SCX_TAG="$SCX_TAG" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            scx-builder:latest \
            bash /work/scripts/build-scx-schedulers.sh

      - name: Verify release assets
        if: steps.preflight.outputs.skip != 'true'
        run: |
          set -euo pipefail

          ls -lh dist/
          test -f dist/SHA256SUMS
          test -f dist/BUILD_MANIFEST

          for b in scx_flash scx_bpfland scx_p2dq scx_rusty scx_beerland scx_lavd scx_loader scxctl; do
            test -x "dist/$b" || { echo "error: dist/$b missing or not executable"; exit 1; }
          done
          for f in scx_loader.service org.scx.Loader.service org.scx.Loader.conf org.scx.Loader.policy; do
            test -f "dist/$f" || { echo "error: dist/$f missing"; exit 1; }
          done

          {
            echo "## Built scx schedulers"
            echo '```'
            ls -lh dist/
            echo '```'
            echo "**Build manifest:**"
            echo '```'
            cat dist/BUILD_MANIFEST
            echo '```'
            echo "**SHA-256 checksums:**"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && steps.preflight.outputs.skip != 'true'
        with:
          name: scx-schedulers-run${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 7
          # This step runs on failure too, to capture partial output for diagnosis. When the
          # build died before writing anything, an empty dist/ is expected, not an error.
          if-no-files-found: warn
          overwrite: true

      - name: Create GitHub Release
        id: release
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          source dist/BUILD_MANIFEST

          BUILD_DATE="$(date -u +%Y-%m-%d)"
          BUILD_DATE_NODASH="$(date -u +%Y%m%d)"
          CHECKSUMS="$(cat dist/SHA256SUMS)"

          TAG="scx-${SCX_TAG}-${BUILD_DATE_NODASH}.${GITHUB_RUN_NUMBER}"
          TITLE="scx schedulers ${SCX_TAG} - ASUS NUC 16 Pro - ${BUILD_DATE}"

          cat > /tmp/release-notes.md << NOTES_EOF
          ## sched-ext/scx ${SCX_TAG}, prebuilt for ASUS NUC 16 Pro

          Userspace sched_ext schedulers built against Ubuntu 26.04 (matching
          the device's own base image) so dynamically-linked libs (libelf,
          libzstd, libseccomp, libbpf, libcap-ng) match exactly.

          ### Binaries

          \`${BINARIES}\`

          ### Build Configuration

          - scx tag: \`${SCX_TAG}\`
          - scx commit: \`${SCX_COMMIT}\`
          - Rust: \`${RUST_VERSION}\`
          - Clang: \`${CLANG_VERSION}\`
          - Target: \`${TARGET}\`
          - Base image: \`${BASE_IMAGE}\`

          ### SHA-256 Checksums

          \`\`\`
          ${CHECKSUMS}
          \`\`\`

          ### Provenance

          - Build timestamp: \`${BUILD_DATE_UTC}\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ### Control plane

          \`scx_loader\` + \`scxctl\` are built from sched-ext/scx-loader (tag-matched
          to scx) and shipped with their systemd unit, DBus activation/policy, and
          polkit action, patched to \`/usr/local/bin\`. The updater installs and enables
          \`scx_loader.service\` (default \`scx_flash\` in Server mode); the direct
          \`nuc16pro-scx-server.service\` stays the fallback if scx_loader is absent.
          NOTES_EOF

          gh release create "$TAG" \
            dist/scx_* dist/scxctl dist/org.scx.Loader.* dist/SHA256SUMS dist/BUILD_MANIFEST \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md

          # Exposed as a job output so anything downstream (and the run log) can name the
          # exact release this run produced without re-deriving the tag format.
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          {
            echo "## Release created"
            echo ""
            echo "$RELEASE_URL"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Tag | \`$TAG\` |"
            echo "| scx version | \`$SCX_TAG\` |"
            echo "| scx commit | \`$SCX_COMMIT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        # Runs AFTER the release on purpose: attestation is additive, and a Sigstore
        # outage here must not discard a kernel that already built and published.
        # Signed, verifiable provenance for every published binary: what built it, from which
        # commit, in which run. Consumers verify with
        #   gh attestation verify <file> --repo <owner>/<repo>
        # These binaries run as root on the target box via scx_loader, so being able to prove
        # where they came from is worth the one extra step.
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/scx_*
            dist/scxctl
