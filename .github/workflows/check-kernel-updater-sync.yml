name: Check kernel-updater script is in sync with tracked sources

# scripts/nuc16pro-kernel-updater.sh is GENERATED, not hand-edited: assemble-kernel-updater.sh
# inlines the tracked modprobe.d/, sysctl.d/, udev/ and systemd/ files into it. The committed
# copy is what the box actually curls and runs, so a hand-edit there - or a change to one of
# the sources without regenerating - puts the installed updater out of step with the repo
# that documents it. This job regenerates and diffs, which makes that divergence impossible
# to merge unnoticed.

run-name: >-
  Updater sync check (${{ github.event_name == 'pull_request'
    && format('PR #{0}', github.event.number)
    || github.ref_name }})

on:
  push:
    paths:
      - 'scripts/nuc16pro-kernel-updater.sh'
      - 'scripts/nuc16pro-kernel-updater.sh.in'
      - 'scripts/assemble-kernel-updater.sh'
      - 'modprobe.d/**'
      - 'sysctl.d/**'
      - 'udev/**'
      - 'systemd/**'
  pull_request:
    paths:
      - 'scripts/nuc16pro-kernel-updater.sh'
      - 'scripts/nuc16pro-kernel-updater.sh.in'
      - 'scripts/assemble-kernel-updater.sh'
      - 'modprobe.d/**'
      - 'sysctl.d/**'
      - 'udev/**'
      - 'systemd/**'
  workflow_dispatch: {}

permissions: {}

# One check per ref. Superseding an in-flight run on a new push is right here: the job is
# a fast, purely derived check, so only the newest commit's answer is interesting.
concurrency:
  group: kernel-updater-sync-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sync-check:
    name: Regenerate scripts/nuc16pro-kernel-updater.sh and diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Read-only job: nothing pushes, so no credential needs to survive in .git/config.
          persist-credentials: false

      - name: Regenerate from tracked sources
        run: bash scripts/assemble-kernel-updater.sh

      - name: Fail if regenerated output differs from committed file
        run: |
          set -uo pipefail

          if git diff --exit-code -- scripts/nuc16pro-kernel-updater.sh; then
            echo "in sync"
            {
              echo "## Kernel updater is in sync"
              echo
              echo "Regenerating \`scripts/nuc16pro-kernel-updater.sh\` from its sources"
              echo "reproduced the committed file byte for byte."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Put the actual diff in the job summary. Without it, the only way to see what
          # drifted is to re-run the generator locally, which is the step people skip.
          {
            echo "## Kernel updater is OUT OF SYNC"
            echo
            echo "\`scripts/nuc16pro-kernel-updater.sh\` is generated by"
            echo "\`scripts/assemble-kernel-updater.sh\` from \`scripts/nuc16pro-kernel-updater.sh.in\`"
            echo "plus \`modprobe.d/\`, \`sysctl.d/\`, \`udev/\` and \`systemd/\`."
            echo
            echo "Edit the sources, run \`bash scripts/assemble-kernel-updater.sh\`, and commit"
            echo "the regenerated file."
            echo
            echo '<details><summary>Diff between committed and regenerated</summary>'
            echo
            echo '```diff'
            git --no-pager diff -- scripts/nuc16pro-kernel-updater.sh | head -400
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error file=scripts/nuc16pro-kernel-updater.sh,title=Generated file out of sync::scripts/nuc16pro-kernel-updater.sh does not match what scripts/assemble-kernel-updater.sh produces from its tracked sources. Edit the sources, re-run the assembler, and commit the result."
          exit 1
